<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <link rel="shortcut icon" href="/images/favicon.webp" type="image/x-icon">
  <link rel="icon" href="/images/favicon.webp" type="image/x-icon">

  <title>Solandium 2063</title>

  <style>
    html,
    body,
    #unity-canvas {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #unity-canvas {
      position: fixed;
      top: 0;
      left: 0;
      background: #231F20;
      display: none;
    }

    body {
      position: absolute;
      top: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    #loadingOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
    }

    #loadingBar {
      width: 80%;
      max-width: 400px;
      height: 20px;
      background-color: #555;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background-color: #ffa785;
      border-radius: 10px;
    }

    #loadingText {
      color: white;
      font-family: 'kode-mono', sans-serif;
      font-size: 22px;
    }

    @font-face {
      font-family: 'kode-mono';
      src: url('/fonts/KodeMono-VariableFont_wght.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    #videoPlayerOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      z-index: 10000;
      display: none;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    #myVideoPlayer {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <canvas
    id="unity-canvas"
    width="100%"
    height="100%"
    tabindex="0">
  </canvas>

  <div id="loadingOverlay">
    <div id="loadingBar">
      <div id="progressBar"></div>
    </div>
    <div id="loadingText">Loading... 0%</div>
  </div>

  <div id="videoPlayerOverlay">
    <video id="myVideoPlayer" preload="auto">
      <source src="StreamingAssets/SolandiumVideo.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <script src="Build/v0.1.1.loader.js"></script>

  <script>
    let unityGameInstance = null;

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      const meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content =
        'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.head.appendChild(meta);
    }

    const unityCanvas = document.getElementById('unity-canvas');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const progressBar = document.getElementById('progressBar');
    const loadingText = document.getElementById('loadingText');

    createUnityInstance(
      unityCanvas,
      {
        arguments: [],
        dataUrl: "Build/SolarGame.data",
        frameworkUrl: "Build/SolarGame.framework.js",
        codeUrl: "Build/SolarGame.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Solandium 2063",
        productVersion: "0.1.0"
      },
      (progress) => {
        if (progressBar && loadingText) {
          const percent = Math.round(progress * 100);
          progressBar.style.width = percent + "%";
          loadingText.innerHTML = `Loading... ${percent}%`;
        }
      }
    )
    .then((instance) => {
      unityGameInstance = instance;

      loadingOverlay.style.display = "none";
      unityCanvas.style.display = "block";

      console.log("Unity instance loaded successfully.");
    })
    .catch((message) => {
      alert(`Failed to load Unity instance: ${message}`);
      console.error(message);
    });

    // ============================
    // Video Player Functions
    // ============================

    function hideVideoPlayerAndResumeGame() {
      const overlay = document.getElementById('videoPlayerOverlay');
      const video = document.getElementById('myVideoPlayer');
      const canvas = document.getElementById('unity-canvas');

      if (!overlay || !video || !canvas) {
        console.error("Video player critical elements not found.");
        return;
      }

      console.log("Attempting to hide video player and resume game.");

      // Stop and reset video
      video.pause();
      video.currentTime = 0;
      video.blur();

      // Hide video
      overlay.style.display = 'none';

      // Ensure Unity canvas is visible
      canvas.style.display = 'block';

      // Tell Unity we're resuming
      if (unityGameInstance) {
        unityGameInstance.SendMessage(
          'GameManager',
          'ResumeFromVideo'
        );
      }

      // Restore focus after browser repaint
      requestAnimationFrame(() => {
        try {
          canvas.focus();

          // Helps restore keyboard/gamepad input on some browsers
          window.dispatchEvent(
            new MouseEvent('mousedown', {
              bubbles: true
            })
          );
        }
        catch (e) {
          console.warn("Could not focus Unity canvas:", e);
        }
      });
    }

    const myVideoPlayerElement =
      document.getElementById('myVideoPlayer');

    if (myVideoPlayerElement) {
      myVideoPlayerElement.addEventListener('ended', () => {
        console.log(
          "Video ended, automatically hiding player and resuming game."
        );

        hideVideoPlayerAndResumeGame();
      });

      myVideoPlayerElement.addEventListener('error', (e) => {
        console.error("Video failed to load.", e);

        hideVideoPlayerAndResumeGame();
      });
    }
    else {
      console.error(
        "Video element 'myVideoPlayer' not found."
      );
    }

    // ============================
    // Fullscreen Helper
    // ============================

    function requestFullScreenMode(element) {
      if (
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
      ) {
        console.log("Already in full-screen mode.");
        return;
      }

      console.log("Entering full-screen...");

      if (element.requestFullscreen) {
        element.requestFullscreen()
          .catch(err => {
            console.error(
              `Error entering full-screen: ${err.message}`
            );
          });
      }
      else if (element.webkitRequestFullscreen) {
        element.webkitRequestFullscreen();
      }
      else if (element.mozRequestFullScreen) {
        element.mozRequestFullScreen();
      }
      else if (element.msRequestFullscreen) {
        element.msRequestFullscreen();
      }
    }
  </script>

</body>

</html>
